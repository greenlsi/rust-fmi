[package]
name = "semaforo_mod_se"
version = "0.1.0"
# 2024 porque el modelo (pegado tal cual) usa let-chains en delta_ext.
edition = "2024"
description = "Demo de #[atomic2fmu] en FORMA MÓDULO: el modelo DEVS vive dentro del módulo y la macro lo lee y genera la FMU"
# xdevs-no-std es GPL-3.0-or-later y esta FMU enlaza con él.
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fmi = { workspace = true, features = ["fmi3"] }
fmi-export = { workspace = true, features = ["fmi3"] }
xdevs_fmi = { path = "../../xdevs_fmi" }
xdevs-no-std = { git = "https://github.com/iscar-ucm/xdevs_no_std.rs.git", branch = "duration", features = [
    "std",
] }

[package.metadata.fmu]
default_experiment = { start_time = "0", stop_time = "200", step_size = "0.5" }
